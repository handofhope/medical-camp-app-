<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hand Of Hope – Medical Camp</title>
<meta name="theme-color" content="#b3202e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HOH Medical">
<style>
html,body{margin:0;height:100%;background:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:2;transition:opacity .4s}
#splash img{width:160px;max-width:50vw}
#splash p{color:#b3202e;margin-top:14px;font-size:14px}
#off{display:none;position:fixed;inset:0;z-index:3;background:#fff;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;color:#b3202e}
#off button{margin-top:14px;padding:10px 22px;border:0;border-radius:8px;background:#b3202e;color:#fff;font-size:15px}
</style></head><body>
<div id="splash"><img src="icons/icon-512.png" alt="Hand Of Hope"><p>Loading medical camp system…</p></div>
<div id="off"><h2>No internet connection</h2><p>The dashboard needs internet to load your data.</p><button onclick="location.reload()">Try again</button></div>
<iframe id="f" title="Hand Of Hope Medical Camp" allow="clipboard-write; camera; fullscreen"></iframe>
<script>
var URL_="https://script.google.com/macros/s/AKfycbwFi5kfiVuHRlK4B6Qvb7EXsyJDBqoXlzpzgA2dTp_-P0XbJdfeTMul9aaaXLFRjjxCxg/exec";
var f=document.getElementById('f'),s=document.getElementById('splash'),off=document.getElementById('off');
function go(){ if(!navigator.onLine){off.style.display='flex';s.style.display='none';return}
  off.style.display='none';s.style.display='flex';s.style.opacity=1;f.src=URL_}
f.addEventListener('load',function(){s.style.opacity=0;setTimeout(function(){s.style.display='none'},400)});
window.addEventListener('online',go);window.addEventListener('offline',function(){off.style.display='flex'});
go();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
